    <div class="toolbar">
      <div class="seg" role="group" aria-label="Vue">

        <button id="vPlan" aria-pressed="false">Plan</button>

      <button id="collapse">Replier le détail</button>
      <button id="mmBtn">Copier en Mermaid</button>
      <span class="xgroup" id="exportGroup" hidden><span class="xlabel">Exporter</span><span class="seg" role="group" aria-label="Exporter"><button id="xMd">Markdown</button><button id="xPng">PNG</button><button id="xSvg">SVG</button><button id="xHtml">Site HTML</button></span></span>

      <button id="saveBtn" class="primary" hidden disabled>Enregistrer</button>

    </div>

      <span>Tu as des modifications non enregistrées de ta dernière visite.</span>

      <button id="draftDrop">Les ignorer</button>
    </div>

      <button id="importCancel">Annuler</button>
    </div>

      <span><b class="g ten">→</b> piste</span>
    </div>

<main>
  <div class="wrap">
    <div class="mapbox" id="mapView">
      <svg id="svg" role="img" aria-label="Carte mentale de la connaissance de soi et de la carrière"><g id="vp"></g></svg>
      <div class="hint" id="hint">glisser · molette pour zoomer</div>
      <div class="editor" id="editor" hidden>
        <div class="ed-head"><span class="eyebrow" id="edKind">Élément</span><button id="edClose" aria-label="Fermer l'éditeur">Fermer</button></div>
        <div class="field"><label for="edText" id="edTextLabel">Texte</label><textarea id="edText" rows="3"></textarea></div>
        <div class="field" id="edSubWrap"><label for="edSub">Sous-titre</label><input id="edSub" type="text"></div>
        <div class="field" id="edMarkWrap"><label for="edMark">Repère</label>
          <select id="edMark">
            <option value="">Aucun</option>
            <option value="+">+ Point haut</option>
            <option value="-">− Point bas</option>
            <option value="todo">○ À compléter</option>
            <option value="ten">⇄ Tension</option>
            <option value="piste">→ Piste</option>
          </select>
        </div>
        <div class="ed-actions">
          <button id="edChild">+ Enfant</button>
          <button id="edSibling">+ À côté</button>
          <button id="edUp" aria-label="Monter">↑</button>
          <button id="edDown" aria-label="Descendre">↓</button>
          <button id="edDel" class="danger">Supprimer</button>
        </div>
      </div>
    </div>
    <div id="plan" hidden></div>
  </div>
</main>`;
document.getElementById('root').innerHTML=SHELL;
const $=id=>document.getElementById(id);

/* ---------- state ---------- */
const SAVED_TEXT=$('data').textContent;
let S=JSON.parse(SAVED_TEXT);
const ROOT={root:true};
let showRead=true, editMode=false, dirty=false, art=null, readOnly=false, sel=null;

function cleanNode(n){const o={t:n.t||""}; if(n.k)o.k=n.k; if(n.c&&n.c.length)o.c=n.c.map(cleanNode); return o}
function serialize(){return{
  root:{t:S.root.t||"",sub:S.root.sub||""},
  updated:S.updated,
  branches:S.branches.map(b=>{const o={t:b.t||"",b:b.b}; if(b.read)o.read=true; if(b.c&&b.c.length)o.c=b.c.map(cleanNode); return o}),
  todos:S.todos.map(t=>({t:t.t||"",p:t.p||"",done:!!t.done}))
}}
const BASE=JSON.stringify(serialize());

function prep(n,d,col,isRead,p){n.d=d;n.col=col;n.isRead=isRead;n.p=p;n.c=n.c||[];n.c.forEach(ch=>prep(ch,d+1,col,isRead,n))}
function rebuild(){
  ROOT.t=S.root.t; ROOT.sub=S.root.sub; ROOT.c=S.branches; ROOT.d=0; ROOT.p=null;
  S.branches.forEach(br=>prep(br,1,br.b,!!br.read,ROOT));
  measure(ROOT);
}
function walk(n,f){f(n);(n.c||[]).forEach(ch=>walk(ch,f))}
function defaultCollapse(){walk(ROOT,n=>{n.collapsed=n.d>=2&&n.c.length>0})}

/* ---------- measure & layout ---------- */
const GLYPH={"+":"+","-":"−",todo:"○",ten:"⇄",piste:"→"}, KCLS={"+":"k-good","-":"k-bad",todo:"k-todo",ten:"k-ten",piste:"k-piste"};
const FONT=d=>d===0?"700 19px 'Bricolage Grotesque'":d===1?"700 15px 'Bricolage Grotesque'":d===2?"500 13.5px 'IBM Plex Sans'":"400 13px 'IBM Plex Sans'";
const LH=d=>[24,19,18,17][Math.min(d,3)], MAXW=d=>[180,180,220,250][Math.min(d,3)];
const PX=d=>[22,14,11,10][Math.min(d,3)], PY=d=>[14,9,7,6][Math.min(d,3)];
const ctx=document.createElement('canvas').getContext('2d');
const disp=n=>((n.t||"").replace(/\s+/g," ").trim())||"…";

function measure(n){
  ctx.font=FONT(n.d);
  const words=(n.k?GLYPH[n.k]+" ":"")+disp(n);
  const lines=[]; let cur="";
  for(const w of words.split(" ")){const t=cur?cur+" "+w:w; if(cur&&ctx.measureText(t).width>MAXW(n.d)){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);
  if(n.root&&n.sub&&n.sub.trim())lines.push(n.sub.trim().toUpperCase());
  n.lines=lines;
  n.w=Math.ceil(Math.max(...lines.map(l=>ctx.measureText(l).width)))+2*PX(n.d);
  n.h=lines.length*LH(n.d)+2*PY(n.d);
  n.c.forEach(measure);
}
const GY=d=>d===1?20:7, GX=d=>d===0?56:30;
const visBranches=()=>S.branches.filter(b=>showRead||!b.read);
function kids(n){return n.root?visBranches():n.c}
function subH(n){const k=kids(n); if(n.collapsed||!k.length)return n.h; const s=k.reduce((a,c)=>a+subH(c),0)+GY(n.d+1)*(k.length-1); return Math.max(n.h,s)}
function place(n,x,yTop,dir){
  const H=subH(n); n.cy=yTop+H/2; n.dir=dir; n.x=dir>0?x:x-n.w;
  const k=kids(n); if(n.collapsed||!k.length)return;
  const cx=dir>0?n.x+n.w+GX(n.d):n.x-GX(n.d);
  const s=k.reduce((a,c)=>a+subH(c),0)+GY(n.d+1)*(k.length-1);
  let y=n.cy-s/2; for(const c of k){place(c,cx,y,dir); y+=subH(c)+GY(n.d+1)}
}
/* Auto-balance: split the branches, in order, where the two sides' visible heights are closest.
   A little hysteresis keeps a branch from hopping sides on every small expand/collapse. */
let lastSplit=null;
function bestSplit(vis){
  const hs=vis.map(subH), side=(a,b)=>{const s=hs.slice(a,b); return s.reduce((x,y)=>x+y,0)+GY(1)*Math.max(0,s.length-1)};
  const cost=k=>Math.max(side(0,k),side(k,hs.length));
  if(vis.length<2)return vis.length;
  let best=1; for(let k=1;k<vis.length;k++)if(cost(k)<cost(best)||cost(k)===cost(best)&&Math.abs(k-vis.length/2)<Math.abs(best-vis.length/2))best=k;
  const ids=vis.map(b=>b.t).join('\u0001');
  if(lastSplit&&lastSplit.ids===ids&&lastSplit.k>0&&lastSplit.k<vis.length&&cost(lastSplit.k)<=cost(best)*1.12+30)best=lastSplit.k;
  lastSplit={ids,k:best}; return best;
}
function layout(){
  ROOT.x=-ROOT.w/2; ROOT.cy=0;
  const vis=visBranches(), half=bestSplit(vis);
  for(const [br,dir] of [[vis.slice(0,half),1],[vis.slice(half),-1]]){
    const tot=br.reduce((a,b)=>a+subH(b),0)+GY(1)*Math.max(0,br.length-1);
    let y=-tot/2; const x=dir>0?ROOT.w/2+GX(0):-ROOT.w/2-GX(0);
    for(const b of br){place(b,x,y,dir); y+=subH(b)+GY(1)}
  }
}

/* ---------- render ---------- */
const NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const vp=$('vp'), svg=$('svg');
function toggle(n){n.collapsed=!n.collapsed;render()}

function render(){
  layout(); vp.textContent="";
  const ge=el('g',{},vp), gn=el('g',{},vp);
  (function draw(n){
    const k=kids(n), open=!n.collapsed&&k.length;
    if(open)for(const c of k){
      const x1=n.dir>0||n.root&&c.dir>0?n.x+n.w:n.x, x2=c.dir>0?c.x:c.x+c.w, mx=(x1+x2)/2;
      const p=el('path',{class:'edge',d:`M${x1} ${n.cy}C${mx} ${n.cy},${mx} ${c.cy},${x2} ${c.cy}`,'stroke-width':[3,2,1.4,1.1][Math.min(c.d-1,3)]},ge);
      p.style.setProperty('--c',`var(--b${c.col})`);
      draw(c);
    }
    const g=el('g',{class:`node d${Math.min(n.d,3)}${n.isRead?' read':''}${n===sel?' sel':''}`,transform:`translate(${n.x},${n.cy-n.h/2})`},gn);
    if(n.col)g.style.setProperty('--c',`var(--b${n.col})`);
    el('rect',{width:n.w,height:n.h,rx:n.d===0?14:n.d===1?9:7},g);
    const tx=el('text',{x:n.root?n.w/2:PX(n.d),'text-anchor':n.root?'middle':'start'},g);
    const hasSub=n.root&&n.sub&&n.sub.trim();
    n.lines.forEach((l,i)=>{
      const y=PY(n.d)+LH(n.d)*(i+.72);
      if(i===0&&n.k){const gl=GLYPH[n.k];
        el('tspan',{x:PX(n.d),y,class:'k '+KCLS[n.k]},tx).textContent=gl;
        el('tspan',{},tx).textContent=l.slice(gl.length);
      } else {el('tspan',{x:n.root?n.w/2:PX(n.d),y,class:hasSub&&i===n.lines.length-1?'sub':''},tx).textContent=l}
    });
    const canToggle=k.length&&!n.root;
    if(canToggle||editMode){
      g.setAttribute('tabindex','0'); g.setAttribute('role','button'); g.setAttribute('aria-label',disp(n));
      if(canToggle)g.setAttribute('aria-expanded',String(!n.collapsed));
      const act=()=>{if(editMode)select(n);else if(canToggle)toggle(n)};
      g.addEventListener('click',()=>{if(!moved)act()});
      g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});
    }
    if(canToggle){
      const kx=n.dir>0?n.w:0, kn=el('g',{class:'knob',transform:`translate(${kx},${n.h/2})`},g);
      el('circle',{r:9},kn); el('text',{},kn).textContent=n.collapsed?k.length:'–';
      kn.addEventListener('click',e=>{e.stopPropagation(); if(!moved)toggle(n)});
    }
  })(ROOT);
}

/* ---------- pan & zoom ---------- */
let V={k:1,x:0,y:0}, moved=false, drag=null;
const apply=()=>vp.setAttribute('transform',`translate(${V.x},${V.y}) scale(${V.k})`);
function fit(){
  const r=svg.getBoundingClientRect(); if(!r.width)return; const b=vp.getBBox();
  const k=Math.max(.3,Math.min(1.15,Math.min(r.width/(b.width+40),r.height/(b.height+40))));
  V={k,x:r.width/2-(b.x+b.width/2)*k,y:r.height/2-(b.y+b.height/2)*k}; apply();
}
function zoomAt(f,cx,cy){const k=Math.max(.25,Math.min(2.5,V.k*f)); V.x=cx-(cx-V.x)*k/V.k; V.y=cy-(cy-V.y)*k/V.k; V.k=k; apply()}
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y};moved=false});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!moved&&Math.hypot(dx,dy)>4){moved=true;svg.classList.add('drag')}
  if(moved){V.x=drag.vx+dx;V.y=drag.vy+dy;apply()}});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');setTimeout(()=>moved=false,0)});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
svg.addEventListener('click',e=>{if(!moved&&editMode&&!e.target.closest('.node'))closeEditor()});
const mid=()=>{const r=svg.getBoundingClientRect();return[r.width/2,r.height/2]};
$('zin').onclick=()=>zoomAt(1.2,...mid());
$('zout').onclick=()=>zoomAt(1/1.2,...mid());
$('fit').onclick=fit;
$('expand').onclick=()=>{walk(ROOT,n=>n.collapsed=false);render();fit()};
$('collapse').onclick=()=>{defaultCollapse();render();fit()};

/* ---------- plan view ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plan=$('plan');
function li(n){const s=esc((n.k?GLYPH[n.k]+" ":"")+disp(n)); return n.c.length?`<li>${s}<ul>${n.c.map(li).join('')}</ul></li>`:`<li>${s}</li>`}
function buildPlan(){plan.innerHTML=visBranches().map(b=>`<details open style="--c:var(--b${b.b})"><summary>${esc(disp(b))}</summary><ul>${b.c.map(li).join('')}</ul></details>`).join('')}
const vMap=$('vMap'), vPlan=$('vPlan'), mapView=$('mapView');
function setView(m){vMap.setAttribute('aria-pressed',String(m));vPlan.setAttribute('aria-pressed',String(!m));mapView.hidden=!m;plan.hidden=m;
  ['expand','collapse','zin','zout','fit'].forEach(id=>$(id).hidden=!m); if(m)fit()}
vMap.onclick=()=>setView(true); vPlan.onclick=()=>setView(false);

/* ---------- header bits ---------- */
function fmtDate(iso){try{return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}catch(e){return iso}}
function renderHeader(){$('eyebrow').textContent=`Connaissance de soi · mis à jour le ${fmtDate(S.updated)}`}

/* ---------- next steps ---------- */
function renderTodos(){
  const box=$('todos'); box.textContent='';
  S.todos.forEach((td,i)=>{
    const card=document.createElement('div'); card.className='todo'+(td.done?' done':'');
    if(editMode){
      card.innerHTML=`<div class="todo-top"><label class="chk"><input type="checkbox" id="td-done-${i}"> Fait</label><button class="danger" id="td-del-${i}">Supprimer</button></div>
        <label class="cap" for="td-t-${i}">Titre</label><input type="text" id="td-t-${i}">
        <label class="cap" for="td-p-${i}">Détail</label><textarea id="td-p-${i}" rows="3"></textarea>`;
      box.appendChild(card);
      const cb=$(`td-done-${i}`), ti=$(`td-t-${i}`), pi=$(`td-p-${i}`);
      cb.checked=!!td.done; ti.value=td.t||''; pi.value=td.p||'';
      cb.onchange=()=>{td.done=cb.checked;card.classList.toggle('done',td.done);setDirty()};
      ti.oninput=()=>{td.t=ti.value;setDirty()};
      pi.oninput=()=>{td.p=pi.value;setDirty()};
      $(`td-del-${i}`).onclick=()=>{S.todos.splice(i,1);setDirty();renderTodos()};
    } else {
      const b=document.createElement('b'); b.textContent=td.t||'…';
      const p=document.createElement('p'); p.textContent=td.p||'';
      card.append(b,p);
      if(td.done){const c=document.createElement('span');c.className='chip';c.textContent='Fait';card.appendChild(c)}
      box.appendChild(card);
    }
  });
  if(editMode){
    const add=document.createElement('button'); add.className='add-todo'; add.id='td-add'; add.textContent='+ Ajouter une étape';
    add.onclick=()=>{S.todos.push({t:'Nouvelle étape',p:'',done:false});setDirty();renderTodos();const n=S.todos.length-1;const ti=$(`td-t-${n}`);if(ti){ti.focus();ti.select()}};
    box.appendChild(add);
  }
}

/* ---------- editor ---------- */
const ed=$('editor'), edText=$('edText'), edSub=$('edSub'), edMark=$('edMark'), edDel=$('edDel');
let delArmed=null;
function kind(n){return n.root?'root':n.d===1?'branch':'item'}
function siblings(n){return n.p?n.p.c:null}
function select(n){sel=n;openEditor();render()}
function closeEditor(){sel=null;ed.hidden=true;disarm();render()}
function disarm(){clearTimeout(delArmed);delArmed=null;edDel.classList.remove('armed');edDel.textContent='Supprimer'}
function openEditor(){
  const n=sel, kd=kind(n); disarm();
  ed.hidden=false;
  $('edKind').textContent=kd==='root'?'Centre de la carte':kd==='branch'?'Branche':'Élément';
  $('edTextLabel').textContent=kd==='root'?'Nom':'Texte';
  edText.value=kd==='root'?(S.root.t||''):(n.t||'');
  $('edSubWrap').hidden=kd!=='root'; edSub.value=S.root.sub||'';
  $('edMarkWrap').hidden=kd!=='item'; edMark.value=n.k||'';
  $('edChild').textContent=kd==='root'?'+ Branche':'+ Enfant';
  $('edSibling').textContent=kd==='branch'?'+ Branche à côté':'+ À côté';
  $('edSibling').hidden=kd==='root';
  ['edUp','edDown'].forEach(id=>$(id).hidden=kd==='root'); edDel.hidden=kd==='root';
  if(kd!=='root'){const s=siblings(n), i=s.indexOf(n); $('edUp').disabled=i<=0; $('edDown').disabled=i>=s.length-1}
}
function refresh(){rebuild();render();buildPlan();renderHeader()}
function nextColor(){const used={};S.branches.forEach(b=>used[b.b]=(used[b.b]||0)+1);let best=1;for(let c=1;c<=9;c++)if((used[c]||0)<(used[best]||0))best=c;return best}
function focusText(){requestAnimationFrame(()=>{edText.focus();edText.select()})}

edText.addEventListener('input',()=>{if(!sel)return; if(sel.root)S.root.t=edText.value; else sel.t=edText.value; refresh(); setDirty()});
edSub.addEventListener('input',()=>{S.root.sub=edSub.value;refresh();setDirty()});
edMark.addEventListener('change',()=>{if(!sel||sel.root)return; if(edMark.value)sel.k=edMark.value; else delete sel.k; refresh(); setDirty()});
$('edClose').onclick=closeEditor;
ed.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeEditor()}});
$('edChild').onclick=()=>{
  if(!sel)return; let nn;
  if(sel.root){nn={t:'Nouvelle branche',b:nextColor(),c:[]};S.branches.push(nn)}
  else {nn={t:'Nouvel élément',c:[]};sel.c.push(nn);sel.collapsed=false}
  refresh(); select(nn); setDirty(); focusText();
};
$('edSibling').onclick=()=>{
  if(!sel||sel.root)return; const s=siblings(sel), i=s.indexOf(sel);
  const nn=kind(sel)==='branch'?{t:'Nouvelle branche',b:nextColor(),c:[]}:{t:'Nouvel élément',c:[]};
  s.splice(i+1,0,nn); refresh(); select(nn); setDirty(); focusText();
};
function move(dir){if(!sel||sel.root)return; const s=siblings(sel), i=s.indexOf(sel), j=i+dir; if(j<0||j>=s.length)return; [s[i],s[j]]=[s[j],s[i]]; refresh(); openEditor(); render(); setDirty()}
$('edUp').onclick=()=>move(-1); $('edDown').onclick=()=>move(1);
edDel.onclick=()=>{
  if(!sel||sel.root)return;
  if(!delArmed){edDel.classList.add('armed');edDel.textContent=sel.c.length?`Supprimer avec ${countDesc(sel)} sous-élément${countDesc(sel)>1?'s':''}`:'Confirmer la suppression';delArmed=setTimeout(disarm,4000);return}
  const s=siblings(sel), i=s.indexOf(sel), parent=sel.p; s.splice(i,1); disarm(); refresh();
  sel=null; select(parent); setDirty();
};
function countDesc(n){let c=0;walk(n,()=>c++);return c-1}

/* ---------- edit mode, saving, drafts ---------- */
const editBtn=$('editBtn'), saveBtn=$('saveBtn'), revertBtn=$('revertBtn'), statusEl=$('status');
function setStatus(msg,warn){statusEl.textContent=msg||'';statusEl.classList.toggle('warn',!!warn)}
function syncControls(){
  const show=!readOnly&&!!art&&(editMode||dirty);
  saveBtn.hidden=!show; revertBtn.hidden=!(show&&dirty); saveBtn.disabled=!dirty;
  editBtn.hidden=readOnly||!art;
  $('importBtn').hidden=readOnly||!art;
}
function writeDraft(){try{const d=JSON.stringify(serialize()); if(d===BASE)localStorage.removeItem(DRAFT_KEY); else localStorage.setItem(DRAFT_KEY,d)}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
function setDirty(){dirty=JSON.stringify(serialize())!==BASE; writeDraft(); setStatus(dirty?'Modifications non enregistrées':'',dirty); syncControls()}
function setEdit(on){
  editMode=on; editBtn.setAttribute('aria-pressed',String(on)); editBtn.textContent=on?'Terminer':'Modifier';
  mapView.classList.toggle('editing',on);
  $('hint').textContent=on?'touche un nœud pour le modifier':'glisser · molette pour zoomer';
  if(!on){sel=null;ed.hidden=true}
  render(); renderTodos(); syncControls();

/* ---------- Mermaid export ---------- */
function mermaid(){
  const cl=s=>(s||'').replace(/[()\[\]{}]/g,'').replace(/\s+/g,' ').trim()||'…';
  const pre={"+":"+ ","-":"− ",todo:"○ ",ten:"⇄ ",piste:"→ "};

  (function w(list,depth){list.forEach(n=>{out.push('  '.repeat(depth)+(n.k?pre[n.k]:'')+cl(n.t));w(n.c||[],depth+1)})})(S.branches,2);
  return '```mermaid\n'+out.join('\n')+'\n```\n';
}

/* ---------- file exports (Markdown, PNG, SVG) ---------- */
let dl=null;
function stamp(){return new Date().toISOString().slice(0,10)}
function markdown(){
  const md=['---','title: Boussole de carrière','updated: '+S.updated,'tags: [carriere, connaissance-de-soi, mentorat-gmd]','---','','# Boussole de carrière','',mermaid(),'## Prochaines étapes',''];
  S.todos.forEach(t=>md.push('- ['+(t.done?'x':' ')+'] **'+(t.t||'').trim()+'**'+((t.p||'').trim()?' : '+t.p.trim().replace(/\s+/g,' '):'')));

  return md.join('\n');
}
function tokens(){
  const cs=getComputedStyle(document.documentElement), o={};
  ['bg','surface','surface2','ink','muted','line','on','good','bad','todo'].forEach(k=>o[k]=cs.getPropertyValue('--'+k).trim());
  for(let i=1;i<=10;i++)o['b'+i]=cs.getPropertyValue('--b'+i).trim();
  return o;
}
const FAM={display:"'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif",body:"'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif",mono:"'IBM Plex Mono', ui-monospace, Menlo, monospace"};
const NF=d=>d===0?{w:700,s:19,f:'display'}:d===1?{w:700,s:15,f:'display'}:d===2?{w:500,s:13.5,f:'body'}:{w:400,s:13,f:'body'};
function scene(){
  const T=tokens(), edges=[], nodes=[];
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  (function draw(n){
    const k=kids(n), open=!n.collapsed&&k.length;
    if(open)for(const c of k){
      const a=n.dir>0||n.root&&c.dir>0?n.x+n.w:n.x, b=c.dir>0?c.x:c.x+c.w, m=(a+b)/2;
      edges.push({type:'path',d:`M${a} ${n.cy}C${m} ${n.cy},${m} ${c.cy},${b} ${c.cy}`,stroke:T['b'+c.col],sw:[3,2,1.4,1.1][Math.min(c.d-1,3)],op:.7});
      draw(c);
    }
    const d=Math.min(n.d,3), x=n.x, y=n.cy-n.h/2, col=n.col?T['b'+n.col]:T.ink;
    x0=Math.min(x0,x-12);x1=Math.max(x1,x+n.w+12);y0=Math.min(y0,y);y1=Math.max(y1,y+n.h);
    nodes.push({type:'rect',x,y,w:n.w,h:n.h,rx:d===0?14:d===1?9:7,
      fill:d===0?T.ink:d===1?col:T.surface, stroke:d===2?col:d===3?T.line:null, sw:d===2?1.4:1, dash:n.isRead&&d>=2?'4 3':null});
    const nf=NF(d), fg=d===0?T.bg:d===1?T.on:T.ink, hasSub=n.root&&n.sub&&n.sub.trim();
    n.lines.forEach((l,i)=>{
      const ty=y+PY(n.d)+LH(n.d)*(i+.72);
      if(hasSub&&i===n.lines.length-1){nodes.push({type:'text',x:x+n.w/2,y:ty,anchor:'middle',runs:[{t:l,fill:fg,w:500,s:12,f:'mono',ls:.72}]});return}
      if(i===0&&n.k){const gl=GLYPH[n.k], gc=n.k==='+'?T.good:n.k==='-'?T.bad:n.k==='todo'?T.todo:col;
        nodes.push({type:'text',x:x+PX(n.d),y:ty,anchor:'start',runs:[{t:gl,fill:gc,w:500,s:nf.s,f:'mono'},{t:l.slice(gl.length),fill:fg,w:nf.w,s:nf.s,f:nf.f}]});return}
      nodes.push({type:'text',x:n.root?x+n.w/2:x+PX(n.d),y:ty,anchor:n.root?'middle':'start',runs:[{t:l,fill:fg,w:nf.w,s:nf.s,f:nf.f}]});
    });
    if(k.length&&!n.root){const cx=n.dir>0?x+n.w:x, cy=y+n.h/2;
      nodes.push({type:'circle',cx,cy,r:9,fill:T.surface,stroke:col,sw:1.4});
      nodes.push({type:'text',x:cx,y:cy+3.5,anchor:'middle',runs:[{t:String(n.collapsed?k.length:'–'),fill:col,w:500,s:10,f:'mono'}]});}
  })(ROOT);
  const pad=32;
  return {T,items:edges.concat(nodes),x:x0-pad,y:y0-pad,w:x1-x0+2*pad,h:y1-y0+2*pad};
}
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toSVG(){
  const S2=scene(), r=v=>Math.round(v*100)/100, out=[];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${r(S2.w)}" height="${r(S2.h)}" viewBox="${r(S2.x)} ${r(S2.y)} ${r(S2.w)} ${r(S2.h)}">`);
  out.push(`<title>Boussole de carrière</title><rect x="${r(S2.x)}" y="${r(S2.y)}" width="${r(S2.w)}" height="${r(S2.h)}" fill="${S2.T.surface2}"/>`);
  for(const it of S2.items){
    if(it.type==='path')out.push(`<path d="${it.d}" fill="none" stroke="${it.stroke}" stroke-width="${it.sw}" stroke-opacity="${it.op}"/>`);
    else if(it.type==='rect')out.push(`<rect x="${r(it.x)}" y="${r(it.y)}" width="${r(it.w)}" height="${r(it.h)}" rx="${it.rx}" fill="${it.fill}"${it.stroke?` stroke="${it.stroke}" stroke-width="${it.sw}"`:''}${it.dash?` stroke-dasharray="${it.dash}"`:''}/>`);
    else if(it.type==='circle')out.push(`<circle cx="${r(it.cx)}" cy="${r(it.cy)}" r="${it.r}" fill="${it.fill}" stroke="${it.stroke}" stroke-width="${it.sw}"/>`);
    else out.push(`<text x="${r(it.x)}" y="${r(it.y)}" text-anchor="${it.anchor}" xml:space="preserve">`+it.runs.map(u=>`<tspan fill="${u.fill}" font-family="${xesc(FAM[u.f])}" font-weight="${u.w}" font-size="${u.s}"${u.ls?` letter-spacing="${u.ls}"`:''}>${xesc(u.t)}</tspan>`).join('')+`</text>`);
  }

  return out.join('\n');
}
function toPNG(){
  return new Promise((res,rej)=>{
    const S2=scene(), k=2, cv=document.createElement('canvas');
    cv.width=Math.ceil(S2.w*k); cv.height=Math.ceil(S2.h*k);
    const c=cv.getContext('2d'); c.scale(k,k); c.translate(-S2.x,-S2.y);
    c.fillStyle=S2.T.surface2; c.fillRect(S2.x,S2.y,S2.w,S2.h);
    const rr=(x,y,w,h,r)=>{c.beginPath(); if(c.roundRect)c.roundRect(x,y,w,h,r); else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}};
    for(const it of S2.items){
      c.setLineDash([]); c.globalAlpha=1;
      if(it.type==='path'){c.globalAlpha=it.op;c.strokeStyle=it.stroke;c.lineWidth=it.sw;c.stroke(new Path2D(it.d))}
      else if(it.type==='rect'){rr(it.x,it.y,it.w,it.h,it.rx);c.fillStyle=it.fill;c.fill();if(it.stroke){if(it.dash)c.setLineDash(it.dash.split(' ').map(Number));c.strokeStyle=it.stroke;c.lineWidth=it.sw;c.stroke()}}
      else if(it.type==='circle'){c.beginPath();c.arc(it.cx,it.cy,it.r,0,Math.PI*2);c.fillStyle=it.fill;c.fill();c.strokeStyle=it.stroke;c.lineWidth=it.sw;c.stroke()}
      else{
        const fonts=it.runs.map(u=>`${u.w} ${u.s}px ${FAM[u.f]}`);
        const widths=it.runs.map((u,i)=>{c.font=fonts[i];return c.measureText(u.t).width+(u.ls?u.ls*u.t.length:0)});
        let x=it.anchor==='middle'?it.x-widths.reduce((a,b)=>a+b,0)/2:it.x;
        c.textAlign='left'; c.textBaseline='alphabetic';
        it.runs.forEach((u,i)=>{c.font=fonts[i];c.fillStyle=u.fill;
          if(u.ls){let cx=x;for(const ch of u.t){c.fillText(ch,cx,it.y);cx+=c.measureText(ch).width+u.ls}}else c.fillText(u.t,x,it.y);
          x+=widths[i]});
      }
    }
    cv.toBlob(b=>b?res(b):rej(new Error('png')),'image/png');
  });
}

/* ---------- Markdown import ---------- */
const MARKS=[["+ ","+"],["− ","-"],["- ","-"],["○ ","todo"],["⇄ ","ten"],["→ ","piste"]];
function inlineMd(t){return t.replace(/\[\[([^\]|]*)\|([^\]]*)\]\]/g,'$2').replace(/\[\[([^\]]*)\]\]/g,'$1').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/(\*\*|__|`)/g,'').replace(/\s+/g,' ').trim()}
function splitMark(t){t=t.trim(); for(const [p,k] of MARKS)if(t.startsWith(p))return{t:t.slice(p.length).trim(),k}; return{t}}
function unwrapShape(t){const m=t.match(/^[A-Za-z0-9_-]*\s*(?:\(\(|\[\[|\{\{|\)\)|\(|\[|\))(.*?)(?:\)\)|\]\]|\}\}|\(\(|\)|\]|\()$/); return m?m[1].trim():t}
const indentOf=l=>l.match(/^\s*/)[0].replace(/\t/g,'    ').length;
function parseMermaid(block){
  const lines=block.split('\n').filter(l=>l.trim()&&!/^\s*mindmap\s*$/.test(l)&&!/^\s*(::|%%)/.test(l));
  if(!lines.length)return null;
  const root={t:unwrapShape(lines[0].trim()),c:[]}, stack=[{i:indentOf(lines[0]),n:root}];
  for(const l of lines.slice(1)){
    const i=indentOf(l); while(stack.length>1&&stack[stack.length-1].i>=i)stack.pop();
    const n=Object.assign(splitMark(inlineMd(unwrapShape(l.trim()))),{c:[]});
    stack[stack.length-1].n.c.push(n); stack.push({i,n});
  }
  return root;
}
function parseOutline(lines){
  const root={t:'',c:[]}; let stack=[{lvl:0,n:root}], inCode=false;
  for(const raw of lines){
    if(/^\s*```/.test(raw)){inCode=!inCode;continue} if(inCode)continue;
    const h=raw.match(/^(#{1,6})\s+(.*)$/), b=raw.match(/^(\s*)[-*+]\s+(?:\[[ xX]\]\s+)?(.*)$/);
    if(h){const L=h[1].length, t=inlineMd(h[2]);
      if(L===1&&!root.t&&root.c.length===0){root.t=t;stack=[{lvl:1,n:root}];continue}
      while(stack.length>1&&stack[stack.length-1].lvl>=L)stack.pop();
      const n={t,c:[]}; stack[stack.length-1].n.c.push(n); stack.push({lvl:L,n});
    } else if(b){const lvl=10+indentOf(b[1]);
      while(stack.length>1&&stack[stack.length-1].lvl>=lvl)stack.pop();
      const n=Object.assign(splitMark(inlineMd(b[2])),{c:[]}); stack[stack.length-1].n.c.push(n); stack.push({lvl,n});
    }
  }
  return root;
}
function parseTodo(text){
  const m=text.match(/^\*\*(.+?)\*\*\s*(?::|—|-)?\s*(.*)$/);
  if(m)return{t:inlineMd(m[1]),p:inlineMd(m[2])};
  const k=text.indexOf(' : '); return k>0?{t:inlineMd(text.slice(0,k)),p:inlineMd(text.slice(k+3))}:{t:inlineMd(text),p:''};
}
function parseMarkdown(src){
  let text=src.replace(/\r\n?/g,'\n');
  if(text.startsWith('---\n')){const e=text.indexOf('\n---',4); if(e>0)text=text.slice(text.indexOf('\n',e+1)+1)}
  let lines=text.split('\n'), todos=null;
  const ti=lines.findIndex(l=>/^#{1,6}\s+prochaines\s+[ée]tapes/i.test(l));
  if(ti>=0){
    const L=lines[ti].match(/^#+/)[0].length; let end=lines.findIndex((l,i)=>i>ti&&(l.match(/^(#{1,6})\s/)||[,'#######'])[1].length<=L); if(end<0)end=lines.length;
    todos=[]; for(const l of lines.slice(ti+1,end)){const m=l.match(/^\s*[-*+]\s+(?:\[([ xX])\]\s+)?(.*)$/); if(m&&m[2].trim())todos.push(Object.assign(parseTodo(m[2].trim()),{done:/x/i.test(m[1]||'')}))}
    lines=lines.slice(0,ti).concat(lines.slice(end));
  }
  const mm=lines.join('\n').match(/```mermaid[^\n]*\n([\s\S]*?)```/);
  let tree=null;
  if(mm&&/^\s*mindmap\s*$/m.test(mm[1]))tree=parseMermaid(mm[1]);
  else tree=parseOutline(lines);
  if(!tree||!tree.c.length)return null;
  let rt=(tree.t||'').trim(), sub=S.root.sub||'';
  const sep=rt.indexOf(' · '); if(sep>0){sub=rt.slice(sep+3).trim();rt=rt.slice(0,sep).trim()}
  if(!rt||/^boussole de carri[eè]re$/i.test(rt))rt=S.root.t;
  const known={}; S.branches.forEach(b=>known[(b.t||'').toLowerCase()]=b.b);
  const used=new Set();
  const branches=tree.c.map(n=>{const o={t:n.t,c:n.c}; delete o.k;
    if(/^ma lecture$/i.test(n.t)){o.b=10;o.read=true} else if(known[n.t.toLowerCase()]&&known[n.t.toLowerCase()]!==10&&!used.has(known[n.t.toLowerCase()]))o.b=known[n.t.toLowerCase()];
    if(o.b&&o.b!==10)used.add(o.b); return o});
  let next=1; branches.forEach(o=>{if(!o.b){while(used.has(next)&&next<9)next++; o.b=next; used.add(next); if(next<9)next++; else next=1}});
  return{root:{t:rt,sub},updated:S.updated,branches,todos:todos||S.todos.map(t=>({...t}))};
}
let pendingImport=null;
function countItems(list){let c=0;list.forEach(n=>walk(n,()=>c++));return c-list.length}
function handleImportText(name,text){
  const res=parseMarkdown(text);
  if(!res){setStatus('Aucune carte trouvée dans ce fichier. Il faut un bloc Mermaid « mindmap » ou une liste à puces.',true);return}
  pendingImport=res;
  const nb=res.branches.length, ni=countItems(res.branches), sameTodos=!/^#{1,6}\s+prochaines\s+[ée]tapes/im.test(text);
  $('importMsg').textContent=`« ${name} » contient ${nb} branche${nb>1?'s':''} et ${ni} élément${ni>1?'s':''}`+(sameTodos?'. Tes prochaines étapes actuelles sont gardées.':` et ${res.todos.length} étape${res.todos.length>1?'s':''}.`)+' La carte actuelle sera remplacée.';
  $('importBanner').hidden=false;
}
function readImportFile(f){

}
